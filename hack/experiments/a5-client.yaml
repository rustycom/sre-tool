# A5 client; see a5-established.yaml. Apply with the server IP substituted:
#   sed "s/A5_SERVER/$A5_SERVER/" hack/experiments/a5-client.yaml | kubectl --context kind-sre-tool apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: a5-client
  namespace: tenant-b
  labels: {app: dashboard, exp: a5}
spec:
  restartPolicy: Never
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
    command:
    - sh
    - -c
    - |
      while true; do date +%T; sleep 1; done |
        socat -T 15 - TCP:A5_SERVER:9000 |
        while read -r line; do echo "echo $line received $(date +%T)"; done
      echo "connection closed at $(date +%T)"
