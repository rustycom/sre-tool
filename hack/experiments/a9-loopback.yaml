# A9: can `kubectl port-forward` reach a listener bound to 127.0.0.1 inside a pod, while a
# deny-all ingress policy selects that pod? Port-forward enters the pod's network namespace
# through the kubelet/CRI, so it should not pass through the CNI's ingress path.
apiVersion: v1
kind: Namespace
metadata:
  name: a9-portforward
---
apiVersion: v1
kind: Pod
metadata:
  name: loopback
  namespace: a9-portforward
  labels: {app: loopback}
spec:
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
    command: ["socat", "TCP-LISTEN:8080,bind=127.0.0.1,fork,reuseaddr", "SYSTEM:echo loopback-ok"]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: a9-portforward
  labels: {app: client}
spec:
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
    args: ["pause"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: a9-portforward
spec:
  podSelector: {}
  policyTypes: [Ingress]
