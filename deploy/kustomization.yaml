# The tool's own deployment (SPEC §10, §11). `make deploy` applies this with the image set to
# the current git SHA.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- serviceaccount.yaml
- clusterrole.yaml
- clusterrolebinding.yaml
- deployment.yaml
- service.yaml
- networkpolicy.yaml
- operator-rbac.yaml
