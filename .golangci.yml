version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive
    - gosec
    - misspell
  exclusions:
    rules:
      # Golden-file tests read and (with -update) write fixtures under testdata/, at paths
      # the test itself builds from constants. 0644 is the normal mode for files in git.
      - path: _test\.go
        linters: [gosec]
        text: "G304|G306"

formatters:
  enable:
    - gofmt
