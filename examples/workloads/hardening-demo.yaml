# Hardening demo. One workload per planner behaviour; the comment above each
# names the action the planner is expected to produce.
apiVersion: v1
kind: Namespace
metadata:
  name: hardening-demo
---
# patch: nothing set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safe-app
  namespace: hardening-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: safe-app}
  template:
    metadata:
      labels: {app: safe-app}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
---
# patch (safe fields) + strict findings. The official image runs as root, so the strict
# profile's runAsNonRoot makes the new pods fail to start: the rollout-gate demo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-nginx
  namespace: hardening-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: root-nginx}
  template:
    metadata:
      labels: {app: root-nginx}
    spec:
      containers:
      - name: nginx
        image: nginx:1.30.6@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: root-nginx
  namespace: hardening-demo
spec:
  selector: {app: root-nginx}
  ports:
  - port: 80
---
# patch, but S2 skipped with a finding: allowPrivilegeEscalation=false is invalid with privileged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-app
  namespace: hardening-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: privileged-app}
  template:
    metadata:
      labels: {app: privileged-app}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
        securityContext:
          privileged: true
---
# patch: R1 added; R2/R3 untouched with a finding (the memory request defaults to the limit).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: limits-only
  namespace: hardening-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: limits-only}
  template:
    metadata:
      labels: {app: limits-only}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
        resources:
          limits:
            memory: 64Mi
---
# none: every field the rules look at (S1, S2, R1-R3, X1-X3) is already set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: already-hardened
  namespace: hardening-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: already-hardened}
  template:
    metadata:
      labels: {app: already-hardened}
    spec:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
---
# skip: opted out by annotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skipped-app
  namespace: hardening-demo
  annotations:
    sre-tool.io/skip: "true"
spec:
  replicas: 1
  selector:
    matchLabels: {app: skipped-app}
  template:
    metadata:
      labels: {app: skipped-app}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
---
# patch + HPA warning: adding a CPU request changes what CPU utilisation means to the HPA.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-app
  namespace: hardening-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: hpa-app}
  template:
    metadata:
      labels: {app: hpa-app}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-app
  namespace: hardening-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-app
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
# patch: StatefulSet with RollingUpdate, so the rollout gate waits on it.
apiVersion: v1
kind: Service
metadata:
  name: stateful-app
  namespace: hardening-demo
spec:
  clusterIP: None
  selector: {app: stateful-app}
  ports:
  - port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-app
  namespace: hardening-demo
spec:
  serviceName: stateful-app
  replicas: 2
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: {app: stateful-app}
  template:
    metadata:
      labels: {app: stateful-app}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
---
# patch: DaemonSet, one pod per node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: hardening-demo
spec:
  selector:
    matchLabels: {app: node-agent}
  template:
    metadata:
      labels: {app: node-agent}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["pause"]
---
# patch, no rollout: only future Jobs get the new template.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: hardening-demo
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: job
            image: nginx:1.30.6@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
            command: ["sh", "-c", "echo nightly done"]
---
# report: a Job's pod template is immutable.
apiVersion: batch/v1
kind: Job
metadata:
  name: once
  namespace: hardening-demo
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: job
        image: nginx:1.30.6@sha256:eb1c896deef834f4e056829fd6dadac8305501f16cc71ba65fb252c8d0aa168e
        command: ["sh", "-c", "echo once done"]
---
# report: a bare Pod's spec is immutable.
apiVersion: v1
kind: Pod
metadata:
  name: bare-pod
  namespace: hardening-demo
  labels: {app: bare-pod}
spec:
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
    args: ["netexec", "--http-port=8080"]
