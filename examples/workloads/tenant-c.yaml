# Isolation bystander. Its traffic to and from A and B must be unaffected by isolation,
# and its pre-existing policy must survive restore untouched.
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: tenant-c
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
      - name: agnhost
        image: registry.k8s.io/e2e-test-images/agnhost:2.66.1@sha256:6e2eef87d0dc77e070a7549bc5fdfa290c0fefe3359eb33c2ad1eda692fe66a4
        args: ["netexec", "--http-port=8080"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: tenant-c
spec:
  selector: {app: client}
  ports:
  - port: 8080
---
# Not created by sre-tool: restore must leave it exactly as it is.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preexisting-allow-all-ingress
  namespace: tenant-c
spec:
  podSelector:
    matchLabels: {app: client}
  policyTypes: [Ingress]
  ingress:
  - {}
